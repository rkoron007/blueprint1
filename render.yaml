services:
  - type: web
    name: disk-mount-test-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    disk:
      name: test-disk
      mountPath: /opt/render/project/src # Use your path from step 2
      sizeGB: 1
